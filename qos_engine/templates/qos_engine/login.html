{% extends 'qos_engine/base.html' %}

{% block title %}Connexion - ARTEC{% endblock %}

{% block content %}
<style>
    .login-container { max-width: 400px; margin: 50px auto; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 5px solid #1a252f; }
    .login-container h2 { text-align: center; color: #1a252f; margin-top: 0; margin-bottom: 30px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #555; }
    .form-control { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; box-sizing: border-box; }
    .btn-submit { background: #1a252f; color: white; border: none; padding: 15px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.3s; }
    .btn-submit:hover { background: #2c3e50; }
    .error-msg { color: #dc3545; background: #f8d7da; padding: 10px; border-radius: 4px; margin-bottom: 20px; text-align: center; font-weight: bold; }
</style>

<div class="login-container">
    <h2>Connexion</h2>
    
    <!-- Affichage des erreurs (ex: mauvais mot de passe) -->
    {% if messages %}
        {% for message in messages %}
            <div class="error-msg">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Nom d'utilisateur</label>
            <input type="text" name="username" class="form-control" required autofocus placeholder="Ex: Orange_Operator">
        </div>
        <div class="form-group">
            <label>Mot de passe</label>
            <input type="password" name="password" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-submit">Se connecter</button>
    </form>
</div>
{% endblock %}
